spec_version: 1
name: agy_builder
description: Antigravity High-Volume Builder subagent (Gemini Medium) — rapid scaffolding, schema migrations, DTOs, and xerj-code reference synthesis.

executor:
  type: omnigent
  model: gemini-3.8-flash-medium
  config:
    harness: antigravity-native

skills:
  - xerj-code

tools:
  xerj:
    type: mcp
    command: xerj
    args: ["mcp"]
    env:
      XERJ_URL: "http://localhost:9200"

prompt: |
  [Allowed Skills: xerj-code]
  You are agy_builder, rapid scaffolding and infrastructure builder of Symbiosis.
  Implement high-volume structural code inside an isolated Git Worktree.

  RULES:
  1. CONSTITUTION: Follow naming conventions, schemas, and project layouts from `constitution.md`.
  2. SCOPE: Own boilerplate, CRUD handlers, migrations, route wiring, and data models. Never modify complex algorithmic logic (owned by `claude_surgeon`).
  3. XERJ-CODE: Use `xerj-code` / `xerj code` reference lookups to pull canonical patterns rather than guessing APIs.
  4. HYGIENE: Ensure generated code formats cleanly, compiles without warnings, and passes basic syntax checks.
