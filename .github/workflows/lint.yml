name: Lint

# Runs the project's pre-commit hooks (ruff, Pyrefly, TypeScript lint/type-check, custom
# anti-pattern grep hooks, etc.) on every non-draft PR and on push to main.
# Surfaces as the `Pre-commit checks` check, a REQUIRED gate entry in
# merge-ready.yml. Draft PRs are skipped; `ready_for_review` refires so the
# check doesn't strand pending.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # Release branches: release.yml's green-CI gate reads check runs off the
      # branch head, so cherry-picks and release-bump commits must run checks.
      - 'release/v[0-9]*'

permissions:
  contents: read

env:
  # No web SPA build during `uv sync` (setup.py _build_web_ui): this job never
  # serves the bundle, and the build otherwise times out on public npm.
  OMNIGENT_SKIP_WEB_UI: "true"
  # Route uv and pip at PyPI. pre-commit installs hook repos via pip (not uv),
  # so PIP_INDEX_URL is needed even though the workflow only invokes uv.
  UV_INDEX_URL: https://pypi.org/simple
  PIP_INDEX_URL: https://pypi.org/simple

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Security precondition gate: untrusted PRs are held until the scan passes
  # (security-gate.yml); trusted authors and non-PR events pass through.
  gate:
    uses: ./.github/workflows/security-gate.yml
    permissions:
      contents: read
      pull-requests: read

  pre-commit:
    name: Pre-commit checks
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check reference policy
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$POLICY_BASE" ] || [ "$POLICY_BASE" = "0000000000000000000000000000000000000000" ]; then
            POLICY_BASE=origin/main
          elif ! git cat-file -e "${POLICY_BASE}^{commit}"; then
            git fetch --no-tags origin "$POLICY_BASE"
          fi
          python3 dev/lint/lint_reference_policy.py --base "$POLICY_BASE" --head "$POLICY_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      # Must run BEFORE any `uv` command: `uv sync`/`uv run` would re-resolve and
      # rewrite a committed proxy URL to canonical, masking it. Checks the
      # committed file as-is (stdlib only, no venv).
      - name: Check uv.lock uses the public PyPI index
        run: python scripts/normalize_uv_lock_registry.py --check uv.lock

      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: true

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        # `--locked` is the hard gate: fails if uv.lock is out of sync with
        # pyproject.toml (a bare `uv run pre-commit` would re-lock first and mask
        # a stale lockfile). Fix locally with `uv lock`.
        # Pyrefly checks optional integrations against their real packages.
        # Compose capability extras with lint tooling instead of duplicating
        # runtime dependencies in the repository-only lint group.
        run: |
          uv sync --locked --group lint --group test \
            --extra hindsight \
            --extra nimble \
            --extra s3 \
            --extra tracing

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Test Merge Ready expiry sweep
        run: node --test .github/scripts/merge-ready/sweep.test.js

      - name: Check Merge Ready shell syntax
        run: |
          for script in .github/scripts/merge-ready/*.sh; do
            bash -n "$script"
          done

      - name: Check locked dependency regression guards
        run: uv run --no-sync pytest tests/e2e/test_lockfile_vulnerable_pins.py -q --reruns 0 -p tests._helpers.required_tests

      - name: Run formatting, lint, and type checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The four packages release in lockstep (identical versions + `==` sibling
  # pins). Assert agreement on every change so drift from a bad merge or
  # cherry-pick — however it happened — is caught before it reaches a release.
  version-lockstep:
    name: Version lockstep check
    needs: gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: All version locations agree
        run: |
          python -m pip install --quiet --disable-pip-version-check packaging
          python scripts/update_versions.py check
